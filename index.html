<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="What happened on this day in history, one story at a time. English, 中文, 日本語." />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>histoday</title>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <img class="backdrop-img" alt="" decoding="async" referrerpolicy="no-referrer" />
      <img class="backdrop-img" alt="" decoding="async" referrerpolicy="no-referrer" />
    </div>

    <header class="bar">
      <span class="wordmark">histoday</span>
      <time id="date" class="date"></time>
      <button id="open-settings" class="icon-btn gear" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
          <path
            d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"
          />
        </svg>
      </button>
    </header>

    <nav id="tabs" class="tabs" role="tablist"><span class="tab-ink" aria-hidden="true"></span></nav>

    <main id="stage" class="stage">
      <section class="story" aria-live="polite">
        <div id="flaps" class="flaps" role="img"></div>
        <div id="story-text" class="story-text">
          <h1 id="headline" class="headline"></h1>
          <a id="article" class="article" target="_blank" rel="noopener"></a>
        </div>
        <div id="status" class="status" hidden></div>
      </section>

      <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>

      <footer class="foot">
        <span id="counter" class="counter"></span>
        <span id="local" class="local" hidden></span>
        <span class="nav">
          <button id="prev" class="icon-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button id="next" class="icon-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
        </span>
      </footer>
    </main>

    <dialog id="settings" class="sheet">
      <div class="sheet-body">
        <div class="sheet-head">
          <h2 id="settings-title"></h2>
          <button id="close-settings" class="icon-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <section class="sheet-section">
          <h3 id="language-title"></h3>
          <div id="langs" class="langs" role="radiogroup"></div>
          <p id="local-hint" class="sheet-note"></p>
        </section>
        <section class="sheet-section">
          <h3 id="about-title"></h3>
          <p id="about-body"></p>
          <p id="source-note" class="sheet-note"></p>
          <p class="sheet-links">
            <a id="source-link" href="https://www.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
            <a href="https://github.com/nickwang94/histoday" target="_blank" rel="noopener">GitHub</a>
          </p>
        </section>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
